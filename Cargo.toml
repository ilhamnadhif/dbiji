[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/dbiji-app"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Tommy Lumos Empire"]
repository = "https://github.com/dbiji/dbiji"
description = "DBiji - lightweight SQL database client written in Rust"

[workspace.dependencies]
# --- internal crates
dbiji-core = { path = "crates/dbiji-core" }
dbiji-sql = { path = "crates/dbiji-sql" }
dbiji-driver-postgres = { path = "crates/dbiji-driver-postgres" }
dbiji-driver-mysql = { path = "crates/dbiji-driver-mysql" }
dbiji-driver-sqlite = { path = "crates/dbiji-driver-sqlite" }
dbiji-driver-mssql = { path = "crates/dbiji-driver-mssql" }
dbiji-driver-clickhouse = { path = "crates/dbiji-driver-clickhouse" }
dbiji-driver-oracle = { path = "crates/dbiji-driver-oracle" }
dbiji-driver-cassandra = { path = "crates/dbiji-driver-cassandra" }
dbiji-driver-redis = { path = "crates/dbiji-driver-redis" }
dbiji-driver-mongodb = { path = "crates/dbiji-driver-mongodb" }
dbiji-driver-elasticsearch = { path = "crates/dbiji-driver-elasticsearch" }
dbiji-net = { path = "crates/dbiji-net" }
dbiji-config = { path = "crates/dbiji-config" }
dbiji-transfer = { path = "crates/dbiji-transfer" }
dbiji-compare = { path = "crates/dbiji-compare" }
dbiji-tasks = { path = "crates/dbiji-tasks" }
dbiji-ai = { path = "crates/dbiji-ai" }
dbiji-grid = { path = "crates/dbiji-grid" }
dbiji-icons = { path = "crates/dbiji-icons" }
dbiji-editor = { path = "crates/dbiji-editor" }
dbiji-visual = { path = "crates/dbiji-visual" }

# --- async / runtime
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
futures = "0.3"
async-trait = "0.1"

# --- database drivers
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-types = { version = "0.2.14", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-protocol = "0.6.12"
tokio-postgres-rustls = "0.14"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "column_metadata", "backup", "functions", "hooks", "limits"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "chrono", "rustls", "sql-browser-tokio"] }
# Oracle's pure Rust thin driver (no Oracle Client libraries); still a beta, so pinned.
oracledb = "=26.0.0-beta.5"
# Cassandra / ScyllaDB (CQL native protocol), with rustls.
scylla = { version = "1.9", default-features = false, features = ["rustls-023"] }
# Redis, Valkey, KeyDB, Dragonfly (RESP), async on tokio, TLS with rustls.
redis = { version = "1.8", default-features = false, features = ["aio", "tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
# MongoDB's official driver: rustls (aws-lc, shared), SRV lookups for Atlas, zlib/snappy compression (no zstd: C).
mongodb = { version = "3.9", default-features = false, features = ["compat-3-0-0", "rustls-tls-aws-lc", "dns-resolver", "zlib-compression", "snappy-compression"] }

# --- TLS / network / crypto
rustls = { version = "0.23", features = ["aws_lc_rs", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "1"
russh = { version = "0.64" }
keyring = "4"
argon2 = "0.6"
chacha20poly1305 = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "json"] }

# --- serialization / data
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1.3"
rust_xlsxwriter = "0.100"
calamine = "0.36"
parquet = { version = "60", default-features = false, features = ["snap"] }
quick-xml = "0.42"
encoding_rs = "0.8"
base64 = "0.23"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }

# --- utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
tempfile = "3"
regex = "1"
rand = "0.10"
cron = "0.17"
directories = "6"
sys-locale = "0.3"
petgraph = "0.8"
sqlparser = { version = "0.63", features = ["visitor"] }
open = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }

# --- UI
# Without egui's bundled fonts: the app loads the ones it uses (theme.rs), so
# the unused Ubuntu-Light (360 KB) is not linked. Tests turn them back on.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "links", "wayland", "x11"] }
egui = { version = "0.36", default-features = false }
epaint_default_fonts = "0.36"
egui_extras = { version = "0.36", default-features = false }
egui_plot = "0.37"
egui_dock = "0.21"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
resvg = "0.48"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = false
