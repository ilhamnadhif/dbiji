name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A runner's DNS or the crates.io index failing for a moment does not fail the run.
  CARGO_NET_RETRY: 10

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude dbiji-driver-duckdb --all-targets -- -D warnings

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude dbiji-driver-duckdb

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbiji
          POSTGRES_PASSWORD: dbiji
          POSTGRES_DB: dbiji
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbiji" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Dbiji_test1
        ports: ["51433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dbiji_test1 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 10s --health-retries 30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dbiji
          MYSQL_DATABASE: dbiji
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pdbiji" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: dbiji
          MARIADB_DATABASE: dbiji
        ports: ["53307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: dbiji
          CLICKHOUSE_PASSWORD: dbiji
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["58123:8123"]
    env:
      DBIJI_TEST_PG: postgres://dbiji:dbiji@127.0.0.1:55432/dbiji
      DBIJI_TEST_MYSQL: mysql://root:dbiji@127.0.0.1:53306/dbiji
      DBIJI_TEST_MARIADB: mariadb://root:dbiji@127.0.0.1:53307/dbiji
      DBIJI_TEST_CLICKHOUSE: http://dbiji:dbiji@127.0.0.1:58123
      DBIJI_TEST_COCKROACH: cockroachdb://root@127.0.0.1:26257/defaultdb?sslmode=disable
      DBIJI_TEST_MSSQL: sqlserver://sa:Dbiji_test1@127.0.0.1:51433/master
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies and DB client tools
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev postgresql-client default-mysql-client
      - uses: Swatinem/rust-cache@v2
      - name: CockroachDB (single node; services cannot pass a command)
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest start-single-node --insecure
          for i in $(seq 1 60); do docker exec crdb ./cockroach sql --insecure -e "select 1" && break; sleep 2; done
      - name: Driver and end-to-end integration tests
        run: >-
          cargo test -p dbiji-driver-postgres -p dbiji-driver-mysql -p dbiji-driver-sqlite
          -p dbiji-driver-clickhouse -p dbiji-driver-duckdb -p dbiji-driver-mssql -p dbiji-transfer
          -p dbiji-compare -p dbiji-tasks -p dbiji-app -- --test-threads=4

  # The oldest server versions DBiji supports: catalog columns, syntax or TLS
  # ciphers of newer versions fail here (PostgreSQL 11's attgenerated, MySQL
  # 5.7's DHE-only TLS).
  integration-oldest:
    runs-on: ubuntu-24.04
    env:
      DBIJI_TEST_PG: postgres://dbiji:dbiji@127.0.0.1:55411/dbiji
      DBIJI_TEST_MYSQL: mysql://root:dbiji@127.0.0.1:53357/dbiji
      DBIJI_TEST_MARIADB: mariadb://root:dbiji@127.0.0.1:53316/dbiji
      DBIJI_TEST_MSSQL: sqlserver://sa:Dbiji_test1@127.0.0.1:51417/master
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies and DB client tools
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev postgresql-client default-mysql-client
      - uses: Swatinem/rust-cache@v2
      # Started here, not as services: a container that fails to start (the runner's
      # Docker networking now and then) is tried again instead of failing the run.
      - name: The oldest servers
        run: |
          start() {
            for i in 1 2 3; do
              docker run -d --name "$1" "${@:2}" >/dev/null && return 0
              docker rm -f "$1" >/dev/null 2>&1; sleep 5
            done
            return 1
          }
          start pg11 -e POSTGRES_USER=dbiji -e POSTGRES_PASSWORD=dbiji -e POSTGRES_DB=dbiji -p 55411:5432 postgres:11
          start mysql57 -e MYSQL_ROOT_PASSWORD=dbiji -e MYSQL_DATABASE=dbiji -p 53357:3306 mysql:5.7
          start mariadb106 -e MARIADB_ROOT_PASSWORD=dbiji -e MARIADB_DATABASE=dbiji -p 53316:3306 mariadb:10.6
          start mssql2017 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Dbiji_test1 -p 51417:1433 mcr.microsoft.com/mssql/server:2017-latest
          ready() { for i in $(seq 1 120); do "$@" >/dev/null 2>&1 && return 0; sleep 2; done; echo "not ready: $*"; return 1; }
          ready docker exec pg11 pg_isready -U dbiji
          ready docker exec mysql57 mysql -uroot -pdbiji -e "SELECT 1"
          ready docker exec mariadb106 healthcheck.sh --connect --innodb_initialized
          ready docker exec mssql2017 /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Dbiji_test1 -Q "SELECT 1" -b
      - name: Driver and end-to-end tests on the oldest servers
        run: >-
          cargo test -p dbiji-driver-postgres -p dbiji-driver-mysql -p dbiji-driver-mssql -p dbiji-transfer
          -p dbiji-compare -p dbiji-tasks -p dbiji-app -- --test-threads=4

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  benchmarks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p dbiji-app
      - name: Binary size (< 40 MB)
        run: |
          size=$(stat -f%z target/release/dbiji)
          echo "binary size: $size bytes"
          test "$size" -lt 41943040
      - name: Headless benchmarks (startup, memory, grid, editor)
        run: target/release/dbiji --bench all --bench-report bench.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench.json

  # A pushed tag (scripts/release.sh --ci) is built, published and put into the
  # Homebrew cask here, once the tests passed.
  bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, integration, integration-oldest]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/bundle-macos.sh --universal
      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Publish the release and update the Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-publish.sh
