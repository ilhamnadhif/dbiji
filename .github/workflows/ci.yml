name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A runner's DNS or the crates.io index failing for a moment does not fail the run.
  CARGO_NET_RETRY: 10

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # aws-lc (TLS) on Windows: its prebuilt assembly, as the runner has no NASM.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      # Code only Windows compiles (the lint job runs on Linux).
      - if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbiji
          POSTGRES_PASSWORD: dbiji
          POSTGRES_DB: dbiji
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbiji" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Dbiji_test1
        ports: ["51433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dbiji_test1 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 10s --health-retries 30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dbiji
          MYSQL_DATABASE: dbiji
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pdbiji" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: dbiji
          MARIADB_DATABASE: dbiji
        ports: ["53307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: dbiji
          CLICKHOUSE_PASSWORD: dbiji
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["58123:8123"]
    env:
      DBIJI_TEST_PG: postgres://dbiji:dbiji@127.0.0.1:55432/dbiji
      DBIJI_TEST_MYSQL: mysql://root:dbiji@127.0.0.1:53306/dbiji
      DBIJI_TEST_MARIADB: mariadb://root:dbiji@127.0.0.1:53307/dbiji
      DBIJI_TEST_CLICKHOUSE: http://dbiji:dbiji@127.0.0.1:58123
      DBIJI_TEST_COCKROACH: cockroachdb://root@127.0.0.1:26257/defaultdb?sslmode=disable
      DBIJI_TEST_MSSQL: sqlserver://sa:Dbiji_test1@127.0.0.1:51433/master
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies and DB client tools
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev postgresql-client default-mysql-client
      - uses: Swatinem/rust-cache@v2
      - name: CockroachDB (single node; services cannot pass a command)
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest start-single-node --insecure
          for i in $(seq 1 60); do docker exec crdb ./cockroach sql --insecure -e "select 1" && break; sleep 2; done
      - name: Driver and end-to-end integration tests
        run: >-
          cargo test -p dbiji-driver-postgres -p dbiji-driver-mysql -p dbiji-driver-sqlite
          -p dbiji-driver-clickhouse -p dbiji-driver-mssql -p dbiji-transfer
          -p dbiji-compare -p dbiji-tasks -p dbiji-app -- --test-threads=4

  # The oldest server versions DBiji supports: catalog columns, syntax or TLS
  # ciphers of newer versions fail here (PostgreSQL 11's attgenerated, MySQL
  # 5.7's DHE-only TLS).
  integration-oldest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DBIJI_TEST_PG: postgres://dbiji:dbiji@127.0.0.1:55411/dbiji
      DBIJI_TEST_MYSQL: mysql://root:dbiji@127.0.0.1:53357/dbiji
      DBIJI_TEST_MARIADB: mariadb://root:dbiji@127.0.0.1:53316/dbiji
      DBIJI_TEST_MSSQL: sqlserver://sa:Dbiji_test1@127.0.0.1:51417/master
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies and DB client tools
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev postgresql-client default-mysql-client
      - uses: Swatinem/rust-cache@v2
      # Started here, not as services: a container that fails to start (the runner's
      # Docker networking now and then) is tried again instead of failing the run.
      - name: The oldest servers
        run: |
          start() {
            for i in 1 2 3; do
              docker run -d --name "$1" "${@:2}" >/dev/null && return 0
              docker rm -f "$1" >/dev/null 2>&1; sleep 5
            done
            return 1
          }
          start pg11 -e POSTGRES_USER=dbiji -e POSTGRES_PASSWORD=dbiji -e POSTGRES_DB=dbiji -p 55411:5432 postgres:11
          start mysql57 -e MYSQL_ROOT_PASSWORD=dbiji -e MYSQL_DATABASE=dbiji -p 53357:3306 mysql:5.7
          start mariadb106 -e MARIADB_ROOT_PASSWORD=dbiji -e MARIADB_DATABASE=dbiji -p 53316:3306 mariadb:10.6
          start mssql2017 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Dbiji_test1 -p 51417:1433 mcr.microsoft.com/mssql/server:2017-latest
          ready() { for i in $(seq 1 120); do "$@" >/dev/null 2>&1 && return 0; sleep 2; done; echo "not ready: $*"; return 1; }
          ready docker exec pg11 pg_isready -U dbiji
          ready docker exec mysql57 mysql -uroot -pdbiji -e "SELECT 1"
          ready docker exec mariadb106 healthcheck.sh --connect --innodb_initialized
          ready docker exec mssql2017 /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Dbiji_test1 -Q "SELECT 1" -b
      - name: Driver and end-to-end tests on the oldest servers
        run: >-
          cargo test -p dbiji-driver-postgres -p dbiji-driver-mysql -p dbiji-driver-mssql -p dbiji-transfer
          -p dbiji-compare -p dbiji-tasks -p dbiji-app -- --test-threads=4

  # Oracle, Cassandra / ScyllaDB, Redis, MongoDB and Elasticsearch in a job of
  # their own: the Oracle image is large and starts slowly.
  integration-drivers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DBIJI_TEST_ORACLE: oracle://dbiji:dbiji@127.0.0.1:51521/FREEPDB1
      DBIJI_TEST_CASSANDRA: cassandra://127.0.0.1:59042
      DBIJI_TEST_REDIS: redis://127.0.0.1:56379
      DBIJI_TEST_MONGO: mongodb://127.0.0.1:57017
      DBIJI_TEST_ELASTIC: http://127.0.0.1:59200
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Oracle Database Free, ScyllaDB, Redis, MongoDB and Elasticsearch
        run: |
          start() {
            for i in 1 2 3; do
              docker run -d --name "$1" "${@:2}" >/dev/null && return 0
              docker rm -f "$1" >/dev/null 2>&1; sleep 5
            done
            return 1
          }
          start oracle -e ORACLE_PASSWORD=Dbiji_test1 -e APP_USER=dbiji -e APP_USER_PASSWORD=dbiji -p 51521:1521 gvenzl/oracle-free:23-slim-faststart
          start scylla -p 59042:9042 scylladb/scylla:6.2 --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
          start redis -p 56379:6379 redis:7
          start mongo -p 57017:27017 mongo:7
          start elastic -p 59200:9200 -e discovery.type=single-node -e xpack.security.enabled=false -e ES_JAVA_OPTS="-Xms512m -Xmx512m" docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          ready() { for i in $(seq 1 150); do "$@" >/dev/null 2>&1 && return 0; sleep 2; done; echo "not ready: $*"; docker logs "$2" | tail -20; return 1; }
          ready docker exec oracle healthcheck.sh
          ready docker exec scylla cqlsh -e "SELECT now() FROM system.local"
          ready docker exec redis redis-cli ping
          ready docker exec mongo mongosh --quiet --eval "db.runCommand({ping: 1})"
          ready curl -sf http://127.0.0.1:59200/_cluster/health
      - name: Driver tests
        run: >-
          cargo test -p dbiji-driver-oracle -p dbiji-driver-cassandra -p dbiji-driver-redis
          -p dbiji-driver-mongodb -p dbiji-driver-elasticsearch -- --test-threads=2

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  benchmarks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p dbiji-app
      - name: Binary size (< 50 MB)
        run: |
          size=$(stat -f%z target/release/dbiji)
          echo "binary size: $size bytes"
          test "$size" -lt 52428800
      - name: Headless benchmarks (startup, memory, grid, editor)
        run: target/release/dbiji --bench all --bench-report bench.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench.json

  # A pushed tag (scripts/release.sh --ci) is built for macOS, Windows and
  # Linux here, then published (and put into the Homebrew cask) once the tests
  # passed.
  bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/bundle-macos.sh --universal
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip

  bundle-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    env:
      # aws-lc (TLS) uses its prebuilt assembly: the runner has no NASM.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/bundle-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  # Built in AlmaLinux 9: the binary needs its glibc (2.34) or later (RHEL /
  # Rocky / Alma 9, Ubuntu 22.04, Debian 12, Fedora 35 and newer).
  bundle-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: almalinux:9
    steps:
      - name: Build tools
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ make git binutils findutils tar gzip which file diffutils
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/bundle-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: dist/DBiji-*-linux-*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, integration, integration-oldest, integration-drivers, bundle, bundle-windows, bundle-linux]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release and update the Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-publish.sh
