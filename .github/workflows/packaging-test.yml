# Temporary: builds the Windows bundle on this branch (no release) and starts it.
name: Packaging test

on:
  push:
    branches: [windows-linux-builds]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  windows-bundle:
    runs-on: windows-2022
    env:
      AWS_LC_SYS_PREBUILT_NASM: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/bundle-windows.ps1
        shell: pwsh
      - name: Start the app (first frame) and take screenshots
        shell: pwsh
        run: |
          $env:DBIJI_HOME = Join-Path $env:RUNNER_TEMP 'dbiji-home'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\dist\$name.png")
          }
          function FirstFrame($exe, $name) {
            $p = Start-Process -FilePath $exe -ArgumentList '--exit-after-first-frame' -PassThru
            if ($p.WaitForExit(40000)) { Write-Host "${name}: first frame, exit $($p.ExitCode)" }
            else { Shot "$name-stuck"; Write-Host "${name}: no first frame in 40 s"; Stop-Process -Id $p.Id -Force }
            Get-ChildItem -Recurse "$env:DBIJI_HOME\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 15 }
          }
          FirstFrame 'target\release\dbiji.exe' 'native'
          # The same with Mesa's software OpenGL next to a copy.
          gh release download --repo pal1000/mesa-dist-win --pattern '*-release-msvc.7z' --dir "$env:RUNNER_TEMP\mesa"
          7z x (Get-ChildItem "$env:RUNNER_TEMP\mesa\*.7z").FullName "-o$env:RUNNER_TEMP\mesa\x" | Out-Null
          New-Item -ItemType Directory -Force soft | Out-Null
          Copy-Item target\release\dbiji.exe soft\
          Copy-Item "$env:RUNNER_TEMP\mesa\x\x64\*.dll" soft\
          FirstFrame 'soft\dbiji.exe' 'mesa'
          $app = Start-Process -FilePath soft\dbiji.exe -PassThru
          Start-Sleep -Seconds 12
          Shot 'windows-shot'
          Write-Host "still running: $(-not $app.HasExited)"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.png

  windows-tests:
    runs-on: windows-2022
    env:
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --exclude dbiji-driver-duckdb --all-targets -- -D warnings
      - run: cargo test --workspace --exclude dbiji-driver-duckdb --no-fail-fast
