[package]
name = "dbiji-net"
description = "SSH tunnels and proxy forwarding for DBiji"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dbiji-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
russh.workspace = true
base64.workspace = true
tracing.workspace = true
directories.workspace = true
zeroize.workspace = true
# HMAC-SHA1 for hashed known_hosts entries (`|1|salt|hash`); same versions russh uses.
hmac = "0.13"
sha1 = "0.11"

[target.'cfg(unix)'.dependencies]
# Killing the whole process group of a timed out shell command.
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
futures.workspace = true
tempfile.workspace = true
rand.workspace = true
