[package]
name = "dbiji-app"
description = "DBiji desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "dbiji"
path = "src/main.rs"

[lib]
name = "dbiji_app"
path = "src/lib.rs"

[features]
default = []
# Embedded DuckDB engine (adds ~30 MB to the binary): `cargo build --release --features duckdb`.
duckdb = ["dep:dbiji-driver-duckdb"]

[dependencies]
dbiji-core.workspace = true
dbiji-icons.workspace = true
dbiji-config.workspace = true
dbiji-net.workspace = true
dbiji-visual.workspace = true
dbiji-grid.workspace = true
dbiji-sql.workspace = true
dbiji-editor.workspace = true
dbiji-compare.workspace = true
dbiji-tasks.workspace = true
dbiji-ai.workspace = true
dbiji-driver-mysql.workspace = true
dbiji-driver-postgres.workspace = true
dbiji-driver-mssql.workspace = true
dbiji-driver-clickhouse.workspace = true
dbiji-driver-sqlite.workspace = true
dbiji-driver-duckdb = { workspace = true, optional = true }
dbiji-transfer.workspace = true
eframe.workspace = true
egui.workspace = true
epaint_default_fonts.workspace = true
egui_dock.workspace = true
egui-phosphor.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true
rfd.workspace = true
image.workspace = true
resvg.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
ureq.workspace = true
open.workspace = true
sha2.workspace = true
zip.workspace = true
# The computer's time zone (already built for chrono's clock).
iana-time-zone = "0.1.65"

[target.'cfg(unix)'.dependencies]
# The time zone's abbreviation (WIB) in the status bar.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSUserDefaults", "NSDictionary", "NSString", "NSValue", "NSObject"] }

[target.'cfg(windows)'.build-dependencies]
# dbiji.exe's icon and version information (build.rs).
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { version = "0.36", features = ["eframe"] }
regex.workspace = true
tempfile.workspace = true
